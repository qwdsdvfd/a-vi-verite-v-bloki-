<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBlock</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="layout">
      <div id="top">
        <div id="console">
          <div class="console-title">Консоль</div>
          <div id="console-out"></div>
        </div>
        <button id="run-btn">▶</button>
      </div>

      <div class="bottom">
        <div id="left" class="column">
          <div class="block variable" draggable="true" data-block-type="statement">
            Переменная
            <div class="var-name-anchor anchor" data-accepts="value" data-limit="1">
              <div class="stack"></div>
            </div>

            <select class="var-mode" disabled>
              <option value="assign">=</option>
              <option value="declare">×</option>
            </select>

            <div class="var-value-anchor anchor" data-accepts="value" data-limit="1">
              <div class="stack"></div>
            </div>
          </div>

          <div class="block array-block" draggable="true" data-block-type="statement">
            Массив
            <div class="array-name anchor" data-accepts="value" data-limit="1">
              <div class="stack"></div>
            </div>
            =
            <div class="array-value anchor" data-accepts="value">
              <div class="stack"></div>
            </div>
          </div>

          <div class="block array-set" draggable="true" data-block-type="statement">
            Изменение
            <div class="anchor array-set-name" data-accepts="value" data-limit="1">
              <div class="stack"></div>
            </div>
            [
            <div class="anchor array-set-index" data-accepts="value" data-limit="1">
              <div class="stack"></div>
            </div>
            ] =
            <div class="anchor array-set-value" data-accepts="value" data-limit="1">
              <div class="stack"></div>
            </div>
          </div>

          <div class="block print anchor" draggable="true" data-block-type="statement">
            Вывести
            <div class="print-anchor anchor" data-accepts="value" data-limit="1">
              <div class="stack"></div>
            </div>
          </div>

          <div class="block math" draggable="true" data-block-type="value">
            Вычисление

            <div class="math-left-anchor anchor" data-accepts="value" data-limit="1">
              <div class="stack"></div>
            </div>

            <select class="math-operator" disabled>
              <option value="+">+</option>
              <option value="-">-</option>
              <option value="*">*</option>
              <option value="/">/</option>
            </select>

            <div class="math-right-anchor anchor" data-accepts="value" data-limit="1">
              <div class="stack"></div>
            </div>
          </div>

          <div class="block if-block" draggable="true" data-block-type="statement">
            <div class="if-header">
              <span class="if-label">Если</span>

              <div class="if-left-anchor anchor" data-accepts="value" data-limit="1">
                <div class="stack"></div>
              </div>

              <select class="if-operator" disabled>
                <option value="==">==</option>
                <option value="!=">!=</option>
                <option value=">">></option>
                <option value="<"><</option>
                <option value=">=">>=</option>
                <option value="<="><=</option>
              </select>

              <div class="if-right-anchor anchor" data-accepts="value" data-limit="1">
                <div class="stack"></div>
              </div>
            </div>

            <div class="if-body-anchor anchor" data-accepts="statement">
              <div class="stack"></div>
            </div>

            <div class="if-else-control">
              <label>
                <input type="checkbox" class="if-else-toggle" disabled />
                Иначе
              </label>
            </div>
            <div class="if-else-anchor anchor" data-accepts="statement" style="display: none">
              <div class="stack"></div>
            </div>
          </div>

          <div class="block while-block" draggable="true" data-block-type="statement">
            <div class="while-header">
              <span class="while-label">Пока</span>

              <div class="while-left-anchor anchor" data-accepts="value" data-limit="1">
                <div class="stack"></div>
              </div>

              <select class="while-operator" disabled>
                <option value="==">==</option>
                <option value="!=">!=</option>
                <option value=">">></option>
                <option value="<"><</option>
                <option value=">=">>=</option>
                <option value="<="><=</option>
              </select>

              <div class="while-right-anchor anchor" data-accepts="value" data-limit="1">
                <div class="stack"></div>
              </div>
            </div>

            <div class="while-body-anchor anchor" data-accepts="statement">
              <div class="stack"></div>
            </div>
          </div>

          <div class="block func-def" draggable="true" data-block-type="statement">
            <div class="func-def-header">
              Функция
              <div class="func-def-name-anchor anchor" data-accepts="value" data-limit="1">
                <div class="stack"></div>
              </div>
            </div>
            <div class="func-def-body-anchor anchor" data-accepts="statement">
              <div class="stack"></div>
            </div>
          </div>

          <div class="block func-call" draggable="true" data-block-type="statement">
            Вызов
            <div class="func-call-name-anchor anchor" data-accepts="value" data-limit="1">
              <div class="stack"></div>
            </div>
          </div>

          <div class="block text-block" draggable="true" data-block-type="value">
            Текст
            <input class="text-input" type="text" disabled>
          </div>
        </div>

        <div id="right" class="column">
          <div class="block anchor anchor-H0">
            Исполнение
            <div class="stack"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
